<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจัดอันดับผู้สอบแข่งขัน</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>🏆 ระบบจัดอันดับผู้สอบแข่งขันตำแหน่งรองปลัด ระดับต้น 69</h1>
        <p id="generatedAt">กำลังอ่านข้อมูล...</p>
      </div>
      <button id="refreshBtn" class="refresh-btn" type="button" onclick="loadData()">
        ↻ โหลดข้อมูลใหม่
      </button>
    </div>
  </header>

  <main>
    <section class="summary-strip" aria-label="สรุปข้อมูล">
      <div class="summary-item">
        <div class="summary-label">ผู้เข้าสอบทั้งหมด</div>
        <div id="totalCandidates" class="summary-value">0</div>
        <div class="summary-sub">คน</div>
      </div>

      <div class="summary-item">
        <div class="summary-label">คะแนนสอบสูงสุด</div>
        <div id="highestExamScore" class="summary-value">0</div>
        <div class="summary-sub">คะแนน</div>
      </div>

      <div class="summary-item">
        <div class="summary-label">คะแนนรวมสูงสุด</div>
        <div id="highestTotalScore" class="summary-value">0.00</div>
        <div class="summary-sub">คะแนน</div>
      </div>

      <div class="summary-item">
        <div class="summary-label">อายุราชการสูงสุด</div>
        <div id="maxServiceText" class="summary-value" style="font-size:20px">0 ปี 0 เดือน</div>
        <div id="maxMeritStep" class="summary-sub">ความดีความชอบสูงสุด 0 ขั้น</div>
      </div>
    </section>

    <section class="toolbar">
      <div class="field">
        <input id="searchInput" type="search" placeholder="ค้นหาชื่อหรือเบอร์โทรศัพท์..." autocomplete="off">
      </div>

      <div class="field">
        <select id="siteFilter">
          <option value="">ทุกสนามสอบ</option>
        </select>
      </div>

      <div id="resultCount" class="result-count">แสดง 0 รายการ</div>
    </section>

    <section class="table-card">
      <div id="tableContainer" class="table-wrap">
        <div class="empty-state">กำลังเตรียมข้อมูล...</div>
      </div>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <strong>กำลังคำนวณและจัดอันดับ</strong>
      <div class="muted" style="margin-top:6px">กรุณารอสักครู่</div>
    </div>
  </div>

  <div id="detailModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modalName" class="modal-title">รายละเอียดคะแนน</h2>
          <p id="modalMeta" class="modal-subtitle"></p>
        </div>
        <button class="close-btn" type="button" onclick="closeDetail()" aria-label="ปิด">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
